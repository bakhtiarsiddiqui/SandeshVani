$kind: http-request
name: Wrong password -> 401
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "definitely-wrong"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
