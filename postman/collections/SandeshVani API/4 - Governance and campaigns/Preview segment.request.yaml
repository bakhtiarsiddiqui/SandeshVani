$kind: http-request
url: "{{baseUrl}}/governance/segments/{{segmentId}}/preview"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "version_id": "{{segmentVersionId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("matched_count is a number", () => pm.expect(pm.response.json().matched_count).to.be.a("number"));
    language: text/javascript
order: 7000
