$kind: http-request
url: "{{baseUrl}}/governance/consent/suppressions"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "audience_member_id": "{{audienceId}}",
      "channel": "email",
      "event_type": "suppressed",
      "reason_code": "user_request",
      "source_code": "postman"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
