$kind: http-request
url: "{{baseUrl}}/governance/consent/processing-basis"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "audience_member_id": "{{audienceId}}",
      "purpose_code": "civic_updates",
      "event_type": "established",
      "basis_code": "consent",
      "evidence_source": "postman"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
