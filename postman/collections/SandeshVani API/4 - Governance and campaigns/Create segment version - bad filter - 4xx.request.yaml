$kind: http-request
name: Create segment version - bad filter -> 4xx
url: "{{baseUrl}}/governance/segments/{{segmentId}}/versions"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "filter_ast": {
        "field": "password_hash",
        "operator": "eq",
        "value": "x"
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("Non-allowlisted field is rejected", () => pm.expect(pm.response.code).to.be.within(400, 422));
    language: text/javascript
order: 6000
