$kind: http-request
url: "{{baseUrl}}/governance/consent/channel-events"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "audience_member_id": "{{audienceId}}",
      "channel": "sms",
      "purpose_code": "civic_updates",
      "decision": "granted",
      "evidence_source": "postman"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
