$kind: http-request
url: "{{baseUrl}}/governance/segments/{{segmentId}}/versions"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "filter_ast": {
        "op": "and",
        "children": [
          {
            "field": "preferred_language",
            "operator": "eq",
            "value": "hi"
          },
          {
            "field": "state_code",
            "operator": "eq",
            "value": "IN-UP"
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.environment.set("segmentVersionId", pm.response.json().id);
    language: text/javascript
order: 5000
