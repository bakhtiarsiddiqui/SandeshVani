$kind: http-request
url: "{{baseUrl}}/governance/segments"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "name": "Hindi speakers in UP",
      "description": "Postman test segment"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.environment.set("segmentId", pm.response.json().id);
    language: text/javascript
order: 4000
