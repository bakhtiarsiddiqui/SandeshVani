$kind: http-request
url: "{{baseUrl}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Reports healthy", () => pm.expect(pm.response.json().status).to.eql("healthy"));
      pm.test("Responds under 3s (Render cold starts may exceed this)", () => pm.expect(pm.response.responseTime).to.be.below(3000));
    language: text/javascript
order: 1000
