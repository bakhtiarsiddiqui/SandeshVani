$kind: http-request
description: Uses {{verifyToken}} saved by the Mailpit request.
url: "{{baseUrl}}/auth/verify-email"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
body:
  type: json
  content: |-
    {
      "token": "{{verifyToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
