$kind: http-request
description: Generates a fresh email each run, so repeat runs never hit 409 or an unverified old user.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "full_name": "{{fullName}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.environment.set("email", "postman." + Date.now() + "@example.com");
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
