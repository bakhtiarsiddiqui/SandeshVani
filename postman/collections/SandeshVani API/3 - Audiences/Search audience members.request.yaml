$kind: http-request
url: "{{baseUrl}}/audiences?limit=10&search=Asha"
method: GET
headers:
  X-Organization-ID: "{{orgId}}"
queryParams:
  limit: "10"
  search: Asha
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
