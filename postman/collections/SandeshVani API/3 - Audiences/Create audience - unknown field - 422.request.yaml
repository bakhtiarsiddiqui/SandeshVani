$kind: http-request
name: Create audience - unknown field -> 422
url: "{{baseUrl}}/audiences"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "full_name": "Extra",
      "email": "x@example.com",
      "hack": true
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 7000
