$kind: http-request
url: "{{baseUrl}}/audiences"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
  X-CSRF-Token: "{{csrfToken}}"
  X-Organization-ID: "{{orgId}}"
body:
  type: json
  content: |-
    {
      "full_name": "Asha Verma",
      "email": "asha.{{$timestamp}}@example.com",
      "phone": "+919876543210",
      "preferred_language": "hi",
      "state_code": "UP",
      "district": "Meerut",
      "city": "Meerut"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.environment.set("audienceId", pm.response.json().id);
    language: text/javascript
order: 1000
