name: Bug / defect
description: Report a reproducible defect
title: "[BUG] "
labels: ["type: bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs, screenshots or environment
      description: Never include credentials, tokens, personal data or production records.
