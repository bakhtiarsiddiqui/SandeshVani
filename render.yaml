databases:
  - name: sandeshvani-preview-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: sandeshvani_preview_db
    user: sandeshvani_preview_db_user

services:
  - type: web
    name: sandeshvani-api
    runtime: python
    plan: free
    region: singapore
    branch: deploy/free-preview
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: SandeshVani
      - key: APP_ENV
        value: production
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: ENABLE_LOCAL_MAIL_SINK
        value: "false"
      - key: JWT_ALGORITHM
        value: RS256
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: JWT_PUBLIC_KEY_PEM
        sync: false
      - key: JWT_ISSUER
        value: sandeshvani-api
      - key: JWT_AUDIENCE
        value: sandeshvani-api
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ALLOWED_ORIGINS
        value: '["https://sandeshvani.vercel.app"]'
      - key: DATABASE_URL
        fromDatabase:
          name: sandeshvani-preview-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: sandeshvani-preview-db
          property: connectionString
      - key: AUDIENCE_IMPORT_STORAGE_DIR
        value: /tmp/sandeshvani/audience-imports
      - key: AUDIENCE_IMPORT_MAX_BYTES
        value: "26214400"
      - key: AUDIENCE_IMPORT_MAX_ROWS
        value: "100000"
